name: Bug report
description: Something doesn't render, a frame looks wrong, or a number is off
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in the details below so we can reproduce the problem.
  - type: input
    id: version
    attributes:
      label: chartreel version
      description: Output of `chartreel --version`
      placeholder: "chartreel 0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: chartreel doctor
      description: Output of `chartreel doctor` (ffmpeg, Chromium and fonts)
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command, config and error output
      description: The exact command, your JSON config, and the full output. Attach the cover PNG or a frame for visual problems.
      render: text
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data sample
      description: The first rows of the CSV (or a minimal file that reproduces the problem). Remove anything private.
      render: text
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
