name: Feature request
description: A new template, theme, option or platform preset
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to make?
      description: The video you have in mind (a link to a similar video helps) and who it is for.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The template, option or behaviour you would like. Example CSV columns are welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
    validations:
      required: false
